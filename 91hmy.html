<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>祝91韩铭宇先生生日快乐</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  html, body {
    background: #000;
  }

  body {
    min-height: 100vh;
    color: #fff;
    font-family: "PingFang SC", "Microsoft YaHei", "Noto Sans SC", "Arial Black", sans-serif;
    padding: 70px 16px 90px;
    overflow-x: hidden;
  }

  /* ===== 闪烁大字 ===== */
  .ticker {
    text-align: center;
    margin: 0 auto 70px;
    max-width: 1200px;
  }
  .ticker .line {
    display: block;
    font-weight: 900;
    line-height: 1.3;
    letter-spacing: 2px;
    white-space: nowrap;
    animation:
      crazyColor .75s steps(1) infinite,
      hardBlink 1.05s steps(1) infinite;
  }
  .l1 { font-size: clamp(20px, 4.2vw, 56px); }
  .l2 { font-size: clamp(26px, 6vw, 86px); animation-delay: .18s, .35s; }
  .l3 { font-size: clamp(23px, 5.2vw, 72px); animation-delay: .36s, .7s; }

  @keyframes crazyColor {
    0%   { color: #ff1a3c; text-shadow: 0 0 10px #ff1a3c, 0 0 28px #ff1a3c, 0 0 60px #ff1a3c; }
    12%  { color: #00ffa3; text-shadow: 0 0 10px #00ffa3, 0 0 28px #00ffa3, 0 0 60px #00ffa3; }
    25%  { color: #ffe600; text-shadow: 0 0 10px #ffe600, 0 0 28px #ffe600, 0 0 60px #ffe600; }
    37%  { color: #00c2ff; text-shadow: 0 0 10px #00c2ff, 0 0 28px #00c2ff, 0 0 60px #00c2ff; }
    50%  { color: #b400ff; text-shadow: 0 0 10px #b400ff, 0 0 28px #b400ff, 0 0 60px #b400ff; }
    62%  { color: #ff6a00; text-shadow: 0 0 10px #ff6a00, 0 0 28px #ff6a00, 0 0 60px #ff6a00; }
    75%  { color: #39ff14; text-shadow: 0 0 10px #39ff14, 0 0 28px #39ff14, 0 0 60px #39ff14; }
    87%  { color: #ff00d4; text-shadow: 0 0 10px #ff00d4, 0 0 28px #ff00d4, 0 0 60px #ff00d4; }
    100% { color: #ff1a3c; text-shadow: 0 0 10px #ff1a3c, 0 0 28px #ff1a3c, 0 0 60px #ff1a3c; }
  }
  @keyframes hardBlink {
    0%, 100% { opacity: 1; }
    43% { opacity: 1; }
    45% { opacity: .1; }
    47% { opacity: 1; }
    68% { opacity: 1; }
    70% { opacity: .15; }
    72% { opacity: 1; }
    86% { opacity: 1; }
    88% { opacity: .05; }
    90% { opacity: 1; }
  }

  /* ===== 照片区 ===== */
  .gallery {
    display: flex;
    align-items: flex-start;
    justify-content: center;
    flex-wrap: wrap;
    gap: 34px;
    max-width: 1180px;
    margin: 0 auto 70px;
  }
  .photo-card {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 18px;
  }
  .photo {
    border-radius: 6px;
    background-color: #050505;
    background-image: var(--img), linear-gradient(135deg, #20004a 0%, #000 55%, #00344a 100%);
    background-size: cover, cover;
    background-position: center, center;
    border: 2px solid rgba(180, 0, 255, .75);
    animation: purplePulse 2.2s ease-in-out infinite;
  }
  .side .photo { width: 210px; height: 262px; }
  .main .photo { width: 330px; height: 410px; }

  @keyframes purplePulse {
    0%, 100% {
      border-color: rgba(140, 0, 255, .55);
      box-shadow: 0 0 16px rgba(140, 0, 255, .45),
                  0 0 38px rgba(180, 0, 255, .25),
                  inset 0 0 60px rgba(0, 0, 0, .95);
    }
    50% {
      border-color: rgba(220, 100, 255, 1);
      box-shadow: 0 0 34px rgba(200, 60, 255, .95),
                  0 0 90px rgba(180, 0, 255, .65),
                  0 0 140px rgba(140, 0, 255, .35),
                  inset 0 0 60px rgba(0, 0, 0, .95);
    }
  }

  /* ===== 名字 ===== */
  .name {
    font-size: clamp(18px, 2.4vw, 30px);
    font-weight: 900;
    letter-spacing: 3px;
    color: #d28bff;
    text-shadow: 0 0 10px #b400ff, 0 0 28px rgba(180, 0, 255, .7);
    animation: namePulse 2.2s ease-in-out infinite;
  }
  .main .name {
    font-size: clamp(22px, 3vw, 38px);
    color: #e6aaff;
    text-shadow: 0 0 14px #c800ff, 0 0 40px rgba(200, 0, 255, .85);
  }
  @keyframes namePulse {
    0%, 100% { opacity: .85; }
    50%      { opacity: 1; }
  }

  /* ===== HAPPY BIRTHDAY：绿紫渐变 ===== */
  .hb {
    text-align: center;
    font-family: "Arial Black", Impact, "Microsoft YaHei", sans-serif;
    font-size: clamp(40px, 9vw, 130px);
    font-weight: 900;
    letter-spacing: 6px;
    line-height: 1.05;
    background: linear-gradient(90deg,
      #00ffa3, #7dff5a, #b400ff, #ff00d4, #b400ff, #7dff5a, #00ffa3);
    background-size: 220% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    -webkit-text-fill-color: transparent;
    animation: gradientSlide 3s linear infinite;
    filter: drop-shadow(0 0 14px rgba(0, 255, 163, .7))
            drop-shadow(0 0 34px rgba(180, 0, 255, .7));
  }
  @keyframes gradientSlide {
    0%   { background-position: 0% 50%; }
    100% { background-position: 220% 50%; }
  }

  @media (max-width: 760px) {
    .gallery { gap: 22px; }
    .side .photo { width: 140px; height: 176px; }
    .main .photo { width: 220px; height: 275px; }
    .ticker .line { white-space: normal; }
  }
</style>
</head>
<body>

  <!-- 三行疯狂闪烁大字 -->
  <div class="ticker">
    <span class="line l1">刚果老板、成都老板发来贺电：</span>
    <span class="line l2">热烈祝贺韩铭宇先生生日快乐！</span>
    <span class="line l3">成年快乐！合作愉快！</span>
  </div>

  <!-- 老板照片  名字 -->
  <div class="gallery">
    <div class="photo-card side">
      <div class="photo" style="--img: url('biyangyigou/xuyi.webp')"></div>
      <div class="name">Boss Yi</div>
    </div>

    <div class="photo-card main">
      <div class="photo" style="--img: url('biyangyigou/zsh.webp')"></div>
      <div class="name">Boss Shuheng</div>
    </div>

    <div class="photo-card side">
      <div class="photo" style="--img: url('biyangyigou/zjfz.webp')"></div>
      <div class="name">Boss Fuzhen</div>
    </div>
  </div>

  <!-- 祝福 -->
  <h2 class="hb">HAPPY BIRTHDAY<br/></h2>
  <h1 align="center" style="font-size:70px">🎂🎂🎂🎈🎈🎈👨🏿🧑🏿👦🏿🎉🎉🎉🥂🥂🥂</h1>

</body>
</html>
